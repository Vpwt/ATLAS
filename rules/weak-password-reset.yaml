id: weak-password-reset
title: Password reset endpoint accepted test request
description: |
  The reset endpoint returned HTTP 200 for a scanner-supplied test payload.
  Validate that this flow enforces identity proof and anti-automation controls.
severity: HIGH
owasp_ref: API2:2023 Broken Authentication
request:
  method: POST
  path: /reset
  body:
    email: test@example.com
match:
  status: 200
